<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Task 3 Authentication</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header class="dashboard-header">
        <h2>My Dashboard</h2>

        <button id="logoutButton" class="logout-button">
            Logout
        </button>
    </header>

    <main class="dashboard-container">
        <section class="dashboard-card">
            <h1>Welcome, <span id="dashboardUsername">User</span>!</h1>

            <p>You have successfully logged in.</p>

            <div class="user-details">
                <p>
                    <strong>Username:</strong>
                    <span id="profileUsername">Loading...</span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="profileEmail">Loading...</span>
                </p>

                <p>
                    <strong>User ID:</strong>
                    <span id="profileId">Loading...</span>
                </p>
            </div>

            <p id="dashboardMessage" class="message" role="status"></p>
        </section>
    </main>
</body>
</html>
